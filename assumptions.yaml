# Assumptions & limitations register. The Streamlit audit page renders this file.
# type: observed | user_set | literature | modelled | limitation
- {id: A01, type: limitation, text: "Landsat LST is surface temperature, not the air temperature a pedestrian feels.", used_in: all}
- {id: A02, type: limitation, text: "Landsat thermal is delivered on a 30 m grid but measured at about 100 m; pixels are not independent.", used_in: bootstrap}
- {id: A03, type: user_set, text: "Block bootstrap uses 4x4 pixel blocks (120 m) to approximate the thermal footprint.", param: uncertainty.block_px}
- {id: A04, type: user_set, text: "Heat weight is drawn uniformly from 0.5-0.7 per bootstrap replicate; base case 0.6.", param: uncertainty.weight_heat_range}
- {id: A05, type: user_set, text: "Score normalisation is min-max over eligible neighbourhoods only; ranks are relative, not absolute risk.", param: scoring.normalisation}
- {id: A06, type: user_set, text: "Eligibility: at least 20 valid pixels, 4 independent blocks and 90% coverage.", param: eligibility}
- {id: A07, type: observed, text: "Composite = pixel-wise median over clear scenes (core, ranking-only and optional); pixels need 3 or more valid scenes.", param: composite}
- {id: A08, type: limitation, text: "Each Landsat scene is paired with the nearest Sentinel-2 scene (lag 0.4-1.6 days). Vegetation is assumed unchanged across the lag.", used_in: ndvi}
- {id: A09, type: modelled, text: "NDVI is computed at 10 m after SCL masking, then averaged onto the 30 m Landsat grid. Pixels with non-positive reflectance are masked and NDVI is clipped to [-1, 1]; counts are reported in scene_qc.csv.", used_in: ndvi}
- {id: A10, type: modelled, text: "Hotspots use Getis-Ord Gi* (radius 3 px) with Benjamini-Hochberg FDR 0.05. Spatial autocorrelation inflates z-scores, so hotspots are descriptive.", param: hotspots}
- {id: A11, type: limitation, text: "Heat-island contrast is relative to the municipal composite distribution, not to a rural reference.", used_in: hotspots}
- {id: A12, type: limitation, text: "Overpass is about 12:05 local time; midday surface heat does not represent night-time or cumulative exposure.", used_in: all}
- {id: A13, type: limitation, text: "The priority score is an exploratory screening indicator, not a health-risk or exposure measure.", used_in: ranking}
- {id: A14, type: limitation, text: "Station locations are matched to neighbourhoods by name only; stations sit in plazas, courts and parks and likely read cooler than streets.", used_in: validation}
- {id: A15, type: limitation, text: "WiFi counts are unique devices per station-day (interval_type OneDay): a presence index, not pedestrian flow, and biased by MAC randomisation.", used_in: abm}
#- {id: A16, type: limitation, text: "Building heights (ypsos layer) are unavailable; shade uses footprints and NDVI as a proxy.", used_in: scenarios}
- {id: A16, type: modelled, text: "Building footprints and heights come from the solar-map layer (66,661 buildings); height provenance is unknown, about 5% of heights are zero and are excluded from height statistics. Roof slope, structure and ownership are not available.", used_in: area_types}
- {id: A17, type: limitation, text: "The scenario simulation reports shade and time-in-sun proxies on walking trips, not thermal exposure or health outcomes. Behavioural parameters (route-choice heat weight, canopy gain) are assumptions, not calibrated to observed behaviour.", used_in: scenarios}
- {id: A18, type: limitation, text: "Land use is ZONED (planned) use from the 1988 zoning plan and amendments, not observed use. Streets and squares are mostly not zoned, so a neighbourhood's zoned share is typically 60-70% of its area.", used_in: area_types}
- {id: A19, type: modelled, text: "Greek zoning labels are mapped to broad area types by keyword rules in landuse_classes.yaml (first match wins). The Greek meanings are the project's reading, pending confirmation by municipal staff. Unmapped labels stay as 'other'.", used_in: area_types}
- {id: A20, type: user_set, text: "Area types come from editable rules in area_types.yaml. Built-form conditions use quantiles of the Athens distribution (large-roof cover and building cover in the top quarter), so thresholds move with the data.", used_in: area_types}
- {id: A21, type: limitation, text: "Heat and vegetation tiers are tertiles of P90 LST and mean NDVI among eligible neighbourhoods; they are relative to Athens, not absolute.", used_in: area_types}
- {id: A22, type: limitation, text: "Candidate actions in actions.yaml are options to evaluate, not recommendations. The file holds no effect sizes or costs; effects come from the scenario engine and ABM, costs are entered by the user.", used_in: actions}
- {id: A23, type: modelled, text: "Population is modelled, not counted. The City of Athens 2021 census total (643,452) is spread over buildings in proportion to weight x volume (footprint x height). Weights: residential zoning 1.0; local-centre, central-commercial, 'other' and unzoned 0.5; all other classes 0. Buildings with height 0 take the median height of their zoning class. Low/high variants (partial weights 0.25 / 1.0) show sensitivity to the weights; they are not statistical intervals.", used_in: population}
- {id: A24, type: modelled, text: "Building populations are rescaled so that each 1 km cell at least 80% inside the neighbourhoods matches the Eurostat/GEOSTAT 2021 census grid (target = grid people x share of the cell inside the study area). 28 cells were controlled; factors ranged 0.25-1.44 and 21% were below 0.5, so the unscaled model overstated people in cells with much non-residential volume. Cells outside the grid's populated list count as zero. Boundary cells absorb the remainder (scale 1.16). Only cell totals are controlled; the pattern inside a cell still comes from building volume and is not validated.", used_in: population}
- {id: A25, type: limitation, text: "Population counts residents only. Workers, students, tourists and visitors are not included, so daytime exposure in commercial, civic and industrial areas (for example Elaionas) is not represented.", used_in: population}
- {id: A26, type: limitation, text: "Building heights come from the solar-map layer with unknown provenance; about 5% are zero and are imputed. Heights drive population volume and building shadows, so errors affect both.", used_in: "population, shade"}
- {id: A27, type: modelled, text: "The walking network is the OpenStreetMap street layer, noded at every crossing (this also joins bridges and underpasses that cross without connecting). Steps and footways are walkable at 1.2 m/s; trips over 1,500 m count as not reached; homes snap to the network within 150 m. About 8.5% of nodes lie in disconnected fragments and are ignored.", used_in: "access, scenarios"}
- {id: A28, type: user_set, text: "Destinations: 'parks' are zoned green land at least 5,000 m2 after merging touching pieces (entrances within 25 m). 'Civic refuge candidates' are civic-zoned land excluding education, sport, transit and nursery labels; this is a placeholder for real cooling refuges, which the municipality must name. Bus stops are the OASA layer (Nov 2025). Zoning is planned use, not observed use.", used_in: "access, scenarios"}
- {id: A29, type: modelled, text: "Shade is a building-shadow model: NOAA-style sun position, shadow = convex hull of the footprint and a copy shifted by height / tan(altitude), street centrelines sampled every 10 m. The convex hull over-covers concave footprints and courtyards. Computed for 31 July at 10:00, 12:00, 14:00 and 16:00 local; 14:00 is close to solar noon (about 13:26) and is the least-shaded hour.", used_in: shade}
- {id: A30, type: limitation, text: "Shade excludes trees, awnings and arcades, so it is a lower bound. Parks and hills show almost no shade, and the benefit of existing or new trees is understated. A street-trees layer would improve this.", used_in: "shade, scenarios"}
- {id: A31, type: user_set, text: "Simulated residents: 150 per neighbourhood drawn by building population; each walks to the destination with the lowest cost = length x (1 + beta x (1 - shade)), beta drawn from 1-3 per run. Results are the mean and 5-95% range over 12 runs. Residents do not interact: no crowding, capacity, parking search or time-of-day schedule.", used_in: scenarios}
- {id: A32, type: user_set, text: "Street-tree scenario: budget in metres of street; a treated street loses 20-60% of its remaining sun (young to mature trees); one tree per 10 m; up to 6 m of kerb per tree pit (an upper bound on kerb affected). Eligible streets: residential, tertiary, pedestrian and living streets of at least 25 m with existing shade up to 60%. Sites ignore street width, utilities and ownership. Sites are chosen first on streets used by the simulated trips, then by remaining sun.", used_in: scenarios}
- {id: A33, type: limitation, text: "The baseline has parks as the only cooling destination, so a new refuge adds access where none existed. Refuge and tree results use different budget units and must not be compared.", used_in: scenarios}
- {id: A34, type: limitation, text: "Only walking trips from home to the nearest park are simulated. Tree benefits on other trips (work, shops, transit) and while waiting are not counted; trips to bus stops and busy places are not yet modelled.", used_in: scenarios}
- {id: A35, type: limitation, text: "Budgets are physical units (metres, sites), not euros. No costs are used; the municipality can attach unit costs at decision time.", used_in: scenarios}
- {id: A36, type: limitation, text: "Scenario scope is the top-priority neighbourhoods. Some of them are industrial with almost no residents, so results mainly describe the populated residential ones in scope.", used_in: scenarios}
- {id: A38, type: modelled, text: "Land cover is four classes on a 10 m grid aligned to the Landsat 30 m grid: building (footprints cover at least 50% of the cell), tree (median summer NDVI at or above 0.40), grass (0.20 to 0.40) and ground (paved or bare, everything else). Water is not mapped. The NDVI cut-offs are assumptions; low (0.35/0.15) and high (0.45/0.25) sets are run and pooled into the intervals. Single street trees, shrubs, green roofs and the difference between asphalt and bare soil are not resolved.", used_in: lulc}
- {id: A39, type: modelled, text: "Surface-temperature response: Landsat summer LST regressed on the tree, grass and building shares of the surrounding 90 m (ground is the reference) plus a smooth position trend, fitted on all eligible pixels of the municipality (and again on pixels within 2 km of Kallimarmaro). Intervals come from a block bootstrap over 300 m blocks; skill is tested on held-out 1 km blocks. This is an observational association from one summer composite, not a measured effect of planting.", used_in: lulc}
- {id: A40, type: limitation, text: "Planting effects describe MATURE canopy. The share of an edited 10 m cell that becomes canopy is drawn from 40-80% (open land) or 20-50% (kerb trees). Tree growth time, species, watering, soil and failure rates are not modelled.", used_in: lulc}
- {id: A41, type: user_set, text: "Planting sites: open land = connected patches of unbuilt, non-street ground of at least 300 m2, taken in order of mean (population x heat) score inside 600 m of the Panathenaic Stadium; street trees = 50 m street pieces with at most 30% existing canopy, same score, 4 m half-width. Ownership, utilities, archaeology rules, slopes and parking are ignored. Budgets are hectares or metres of street, not euros.", used_in: lulc}
- {id: A42, type: user_set, text: "New road: a straight alignment with a chosen width converts trees and grass to asphalt (and buildings if demolition is switched on); an optional 3 m tree verge each side is planted with 30-60% canopy. The alignment shipped in lulc.yaml is a PLACEHOLDER, not a real project. Added traffic, vehicle heat, noise, air quality and changed walking or parking patterns are not modelled here.", used_in: lulc}
- {id: A43, type: limitation, text: "Outcomes are changes in modelled surface temperature (zone mean, edited area, population-weighted, and people living in pixels in the hottest 10% of Athens). Surface temperature is not air temperature or thermal comfort, and satellite pixels say little about indoor heat, where much heat harm occurs. Population is modelled residents only, not moved when buildings are demolished (displaced people are counted). No vulnerability weighting is applied because age, health, cooling-centre and hospital data are not available.", used_in: lulc}
- {id: A44, type: user_set, text: "Imagery can be switched in the app or in lulc.yaml: the Sentinel-2 files already downloaded (red and near-infrared, NDVI only) or a live STAC search (Planetary Computer, Sentinel-2 L2A) filtered by year, months, cloud cover and number of scenes, using one MGRS tile. Each index is computed per scene after cloud, shadow and snow masking (SCL) and the scenes are median-composited; at least a chosen number of clear scenes is needed per pixel. Downloaded scenes are cached.", used_in: lulc}
- {id: A45, type: modelled, text: "Selectable spectral indices (NDVI, SAVI, EVI, NDBI, MNDWI, NDWI, BSI, NBR2, albedo, brightness) use standard formulas on L2A surface reflectance. 'Calibration' means two things here: reflectance scale and offset are read from each scene's metadata, and the classifier below is fitted to reference labels. Indices are not calibrated against field reflectance or temperature measurements. The albedo is a linear Sentinel-2 approximation (Bonafoni and Sekertekin 2020).", used_in: lulc}
- {id: A46, type: modelled, text: "Calibrated classes: a gradient-boosting classifier decides ground, tree or grass from the chosen features, trained on a balanced, stratified sample of reference labels inside the municipality and re-weighted to the true class frequencies; buildings always come from the footprints. The low, base and high sets use probability thresholds of 0.35, 0.5 and 0.65. Accuracy is measured on held-out 600 m blocks against the reference labels.", used_in: lulc}
- {id: A47, type: limitation, text: "Reference labels (ESA WorldCover 2020 or 2021, about 75-85% accurate worldwide) are themselves modelled and are older than the imagery, so a calibrated classifier can reproduce their errors, for example missing street trees. Agreement with the reference is not accuracy on the ground. Your own labelled points or polygons override WorldCover where they exist and are the better reference.", used_in: lulc}
- {id: A48, type: modelled, text: "Embeddings are the AlphaEarth Foundations annual Satellite Embedding (64 learned axes at 10 m, 2017-2025, CC-BY 4.0), resampled by nearest neighbour on the raw integers. They summarise a whole year, not the summer scenes, are not physical quantities, and cannot be inspected per axis. They only feed the classifier; the temperature model still uses the resulting classes. Tile discovery follows the published layout and has not been exercised against the live bucket by the developers.", used_in: lulc}
- {id: A49, type: user_set, text: "Which evidence bears on which candidate action is set in decision_map.yaml: 'Simulated' = a scenario varies that action's lever; 'Partly (proxy)' = a scenario varies something close (a new refuge site stands in for a pocket park); 'Not testable yet' = nothing in the platform estimates the effect. This mapping is a judgement, not a result, and can be edited."}
- {id: A50, type: modelled, text: "Per-neighbourhood scenario results (scenario_by_neighbourhood.csv) summarise each neighbourhood's own simulated residents inside the same runs as the scope-wide results. Tree and refuge sites are chosen for the whole scope, so a neighbourhood's change depends on where the plan places them; it is not the effect of spending that budget in that neighbourhood alone. Neighbourhoods outside the scope have no results."}
- {id: A51, type: limitation, text: "The decision tables show effects on shade and access only. They are not ranked by cost or by health benefit, and they do not combine different measures (minutes in the sun, people within 5 minutes). Side effects without data (parking, deliveries, traffic) are listed as not counted."}

